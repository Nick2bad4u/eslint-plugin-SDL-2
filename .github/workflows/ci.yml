name: "Continuous Integration"

run-name: "Continuous Integration • ${{ github.ref_name }} @${{ github.actor }}"

concurrency:
    group: "ci-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

on:
    push:
        branches:
            - "main"
    pull_request:
    merge_group:
        types:
            - "checks_requested"

jobs:
    test:
        name: "Test (${{ matrix.label }})"
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 60
        permissions:
            contents: "read"
            id-token: "write"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - label: "linux"
                      os: "ubuntu-latest"
                      codecov_flag: "os-linux"
                    - label: "windows"
                      os: "windows-latest"
                      codecov_flag: "os-windows"
                    - label: "macos"
                      os: "macos-latest"
                      codecov_flag: "os-macos"
        defaults:
            run:
                shell: "bash"
        env:
            CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              if: "${{ matrix.os == 'ubuntu-latest' }}"
              uses: "step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40" # v2.20.1
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"

            - name: "Install repository npm version"
              run: |
                  set -euo pipefail
                  npm_version=$(node -p "require('${GITHUB_WORKSPACE}/package.json').packageManager.split('@').at(-1)")
                  [[ "$npm_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
                  cd "$RUNNER_TEMP"
                  npm install --global --ignore-scripts "npm@$npm_version" # NOSONAR -- version is exact in packageManager.
                  hash -r
                  test "$(npm --version)" = "$npm_version"

            - name: "Install dependencies"
              # npm 12 enforces the exact package.json allowScripts policy.
              run: "npm ci" # NOSONAR -- strict-allow-scripts blocks every unapproved lifecycle script.

            - name: "Build package"
              run: "npm run build"

            - name: "Verify README rules table sync"
              run: "npm run sync:readme-rules-table"

            - name: "Typecheck"
              run: "npm run typecheck"

            - name: "Run tests with coverage and JUnit report"
              run: "npm run test:ci:coverage"
              env:
                  CI: "true"
                  MAX_THREADS: "1"
                  TYPEFEST_VITEST_HANGING_PROCESS_REPORTER: "true"
                  VITEST_HANGING_PROCESS_REPORTER: "true"

            - name: "Verify coverage artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('coverage/lcov.info').is_file(), 'coverage/lcov.info was not generated'"

            - name: "Verify JUnit artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('test-report.junit.xml').is_file(), 'test-report.junit.xml was not generated'"

            - name: "Upload test results to Codecov"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "Nick2bad4u/eslint-plugin-sdl-2"
                  files: "test-report.junit.xml"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-junit-${{ matrix.codecov_flag }}"
                  report_type: "test_results"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

            - name: "Upload coverage to Codecov"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "Nick2bad4u/eslint-plugin-sdl-2"
                  files: "./coverage/lcov.info"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-unit-coverage-${{ matrix.codecov_flag }}"
                  report_type: "coverage"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

    eslint9-compat:
        name: "ESLint 9 Compatibility (${{ matrix.label }})"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20
        permissions:
            contents: "read"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - eslint-js-version: "9.0.0"
                      eslint-version: "9.0.0"
                      label: "9.0.0"
                    - eslint-js-version: "^9.39.1"
                      eslint-version: "^9.39.1"
                      label: "9.latest"
        defaults:
            run:
                shell: "bash"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              uses: "step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40" # v2.20.1
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version-file: ".node-version"

            - name: "Install repository npm version"
              run: |
                  set -euo pipefail
                  npm_version=$(node -p "require('${GITHUB_WORKSPACE}/package.json').packageManager.split('@').at(-1)")
                  [[ "$npm_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
                  cd "$RUNNER_TEMP"
                  npm install --global --ignore-scripts "npm@$npm_version" # NOSONAR -- version is exact in packageManager.
                  hash -r
                  test "$(npm --version)" = "$npm_version"

            - name: "Install dependencies"
              # npm 12 enforces the exact package.json allowScripts policy.
              run: "npm ci" # NOSONAR -- strict-allow-scripts blocks every unapproved lifecycle script.

            - name: "Build package"
              run: "npm run build"

            - name: "Pack the compatibility candidate"
              id: "pack"
              run: |
                  set -euo pipefail
                  npm pack --json --pack-destination "${RUNNER_TEMP}" > "${RUNNER_TEMP}/npm-pack.json"
                  filename=$(node scripts/read-npm-pack-filename.mjs < "${RUNNER_TEMP}/npm-pack.json")
                  echo "tarball=${RUNNER_TEMP}/${filename}" >> "$GITHUB_OUTPUT"

            - name: "Install isolated ESLint 9 runtime"
              env:
                  ESLINT_JS_VERSION: "${{ matrix.eslint-js-version }}"
                  ESLINT_VERSION: "${{ matrix.eslint-version }}"
                  PACKAGE_TARBALL: "${{ steps.pack.outputs.tarball }}"
              run: |
                  set -euo pipefail
                  compat_dir="${RUNNER_TEMP}/eslint9-compat"
                  mkdir -p "${compat_dir}/scripts" "${compat_dir}/test/fixtures/ts"
                  cd "$compat_dir"
                  npm init --yes >/dev/null
                  typescript_version=$(node -p "require('${GITHUB_WORKSPACE}/package.json').devDependencies.typescript")
                  npm install --package-lock=false \
                    "${PACKAGE_TARBALL}" \
                    "eslint@${ESLINT_VERSION}" \
                    "@eslint/js@${ESLINT_JS_VERSION}" \
                    "typescript@${typescript_version}"
                  cp "${GITHUB_WORKSPACE}/scripts/eslint9-compat-smoke.mjs" scripts/
                  cp "${GITHUB_WORKSPACE}/test/fixtures/ts/compat-no-insecure-"*.invalid.ts test/fixtures/ts/
                  printf '%s\n' '{"compilerOptions":{"strict":true,"target":"ESNext"},"include":["test/fixtures/ts/**/*.ts"]}' > tsconfig.eslint.json

            - name: "Run ESLint 9 compatibility smoke checks"
              run: >-
                  cd "${RUNNER_TEMP}/eslint9-compat" &&
                  SDL_PLUGIN_SPECIFIER=eslint-plugin-sdl-2
                  node scripts/eslint9-compat-smoke.mjs --expect-eslint-major=9
